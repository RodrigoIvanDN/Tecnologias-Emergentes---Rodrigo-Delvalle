<!doctype html>
<html lang="es" data-bs-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini App de Noticias - Bootstrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-ligth">
    <div class="container my-5">
      <h1 class="text-center mb-4">Mini App de Noticias (Bootstrap)</h1>

      <div id="contenedor-noticias" class="row g-4"></div>
    </div>

    <script>
      fetch("https://jsonplaceholder.typicode.com/posts")
        .then((response) => response.json())
        .then((data) => {
          const contenedor = document.getElementById("contenedor-noticias");

          // Tomamos solo los primeros 6 elementos para que la página no se sature
          data.slice(0, 9).forEach((post) => {
            contenedor.innerHTML += `
                        <div class="col-md-4">
                            <div class="card h-100 shadow-sm">
                                <div class="card-body">
                                    <h5 class="card-title text-capitalize">${post.title}</h5>
                                    <p class="card-text">${post.body}</p>
                                </div>
                            </div>
                        </div>
                    `;
          });
        })
        .catch((error) => console.error("Hubo un error:", error));
    </script>
  </body>
</html>
