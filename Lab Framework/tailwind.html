<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini App de Noticias - Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
      <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">
        Mini App de Noticias (Tailwind)
      </h1>
      <div
        id="contenedor-noticias"
        class="grid grid-cols-1 md:grid-cols-3 gap-6"
      ></div>
    </div>

    <script>
      fetch("https://jsonplaceholder.typicode.com/posts")
        .then((response) => response.json())
        .then((data) => {
          const contenedor = document.getElementById("contenedor-noticias");
          data.slice(0, 9).forEach((post) => {
            contenedor.innerHTML += `
                        <div class="bg-white p-6 rounded-lg shadow-md flex flex-col justify-between">
                            <h2 class="text-xl font-semibold mb-2 capitalize text-gray-800">${post.title}</h2>
                            <p class="text-gray-600">${post.body}</p>
                        </div>
                    `;
          });
        })
        .catch(error => console.error('Hubo un error', error));
    </script>
  </body>
</html>
